# Compila la app y publica la imagen lista para usar.
# El servidor (1 GB de RAM) no puede compilar: solo descarga el resultado.
name: Compilar imagen

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar al registro de imagenes de GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compilar y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/arielkauderertgp/openreply:latest
            ghcr.io/arielkauderertgp/openreply:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
